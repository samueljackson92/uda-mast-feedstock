name: uda-mast conda package

# Repackages uda-mast (PyPI only upstream) for the ga-fdp channel.
#
#   staging-X.Y.Z  -> build, test, upload to ga-fdp/label/staging
#   release-X.Y.Z  -> relabel those exact bytes to main. NO rebuild.
#
# To ship a new upstream version: bump `version` and `sha256` in
# recipe/recipe.yaml (refresh the patch if pyproject.toml moved), merge,
# then push staging-<version>; after checking it, push release-<version>.
on:
  push:
    branches:
      - main
    tags:
      - 'staging-*'
      - 'release-*'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    if: "!startsWith(github.ref, 'refs/tags/release-')"
    # noarch: python -- one build serves every platform.
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          run-install: false

      - name: Build and test
        run: |
          pixi global install rattler-build
          rattler-build build --recipe recipe/ \
            --channel conda-forge \
            --output-dir ${HOME}/outdir

      - name: The built version must match the tag
        if: startsWith(github.ref, 'refs/tags/staging-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/staging-}"
          shopt -s nullglob
          built=(${HOME}/outdir/noarch/uda-mast-${VERSION}-*.conda)
          if [ ${#built[@]} -ne 1 ]; then
            echo "::error::tag says ${VERSION}, but the recipe built:"
            ls -la ${HOME}/outdir/noarch/ || true
            exit 1
          fi
          echo "ARTIFACT=${built[0]}" >> $GITHUB_ENV

      - name: Upload to staging
        if: startsWith(github.ref, 'refs/tags/staging-')
        run: |
          rattler-build upload anaconda \
            --owner ga-fdp \
            --channel staging \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            "$ARTIFACT"

      - name: Retire the superseded staging candidate
        if: startsWith(github.ref, 'refs/tags/staging-')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/staging-}"
          python .github/scripts/channel_tools.py retire \
            uda-mast "${VERSION}" "${RUNNER_TEMP}/attic"

      - name: Keep the retired bytes off-channel
        if: always() && startsWith(github.ref, 'refs/tags/staging-')
        uses: actions/upload-artifact@v4
        with:
          name: retired-uda-mast-candidates
          path: ${{ runner.temp }}/attic
          if-no-files-found: ignore
          retention-days: 90

  promote:
    if: startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Move staging -> main
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          python .github/scripts/channel_tools.py promote uda-mast "${VERSION}"
